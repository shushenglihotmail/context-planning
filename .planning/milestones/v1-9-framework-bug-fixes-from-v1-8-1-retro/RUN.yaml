      - id: bug-a-roadmap-scanner
        title: "Bug A — ROADMAP scanner accepts both ### and #### Phase headings"
        summary: "Modify lib/roadmap.js listPhases/listCollapsedPhaseNums regexes to
          match either heading depth so #### Phase 8: headings (GSD-imported or
          hand-edited) are discoverable. Scanner-only fix; no
          auto-normalization. Add test/dryrun-roadmap-h4.js fixture proving
          listPhases finds the phase and audit yields zero phase-no-roadmap
          findings."
      - id: bug-b-write-summary-frontmatter
        title: Bug B — cp write-summary validates against expected_files frontmatter
          only
        summary: "Replace path-token scraping in lib/milestone.writeSummary with
          frontmatter expected_files: array lookup. Missing frontmatter = no-op
          (DEBUG log). --no-file-check still works but emits deprecation warning
          to stderr. Fixture: PLAN.md body mentions src/foo.ps1 (does not
          exist), frontmatter lists [README.md] (exists); writeSummary succeeds
          without --no-file-check."
      - id: bug-c-complete-milestone-banner
        title: Bug C — cp complete-milestone clears STATE.md cp:current-focus banner
        summary: "Wire lib/state.regenerate into bin/commands/complete-milestone.js
          after the milestone close. Wrap in try/catch; failure logs WARN but
          does not roll back. Fixture: milestone with stale banner, run
          complete-milestone, assert banner cleared."
      - id: bug-d-doctor-fix-dual-plan
        title: Bug D — cp doctor --fix-dual-plan auto-removes long-form when short-form
          exists
        summary: "Add fixDualPlan(root) to lib/audit-fix.js (or wherever doctor fixers
          live). Delete long-form NN-MM-...-PLAN.md only after confirming
          short-form PLAN.md exists and is non-empty. Each deletion logged. Wire
          --fix-dual-plan flag to bin/commands/doctor.js. Fixture: phase with
          both forms, --fix-dual-plan, assert long-form deleted, short-form
          intact."
      - id: bug-e-audit-sham-review-log
        title: Bug E — cp audit MEDIUM rule sham-review-log
        summary: "Add sham-review-log rule to lib/audit.js. Fires on completed phases
          whose resolved execute skill is in reviewer-bearing allowlist
          (initial: superpowers/subagent-driven-development,
          superpowers/requesting-code-review) and whose REVIEW-LOG.md has zero
          entries OR every entry reviewer is empty/null/orchestrator
          (inline)/self. Always-on MEDIUM. Parse errors degrade to INFO not-run.
          Fixture: phase with stub REVIEW-LOG and SDD-routed execute, assert
          finding."
      - id: bug-f-skill-attestation
        title: Bug F — skill-load attestation channel + skill-resolved-but-not-loaded
          audit
        summary: "(1) Workflow-runner appends attestation contract to per-phase prompt:
          harness must emit invoked_skill: <name> block in mark-complete stdin.
          (2) bin/commands/run.js mark-complete parses block, writes
          invoked_skill to .run-state/<slug>/<phase>.json. Back-compat: missing
          field = <unrecorded>. (3) New audit rule skill-resolved-but-not-loaded
          MEDIUM — cross-references run-state vs resolved execute skill, emits
          when mismatch. Same allowlist as Bug E. Fixture: synthetic run-state
          with <unrecorded>, assert finding."
        depends_on:
          - bug-e-audit-sham-review-log
